name: KiCAD client packaging

on:
  workflow_dispatch:
  schedule:
    # Keep the vcpkg cache alive every 5 days.
    - cron: "17 3 */5 * *"

jobs:
  # ------------------------------------------------------------
  # FULL INSTALLER PACKAGE
  # ------------------------------------------------------------
  create_full_package:
    runs-on: windows-2022

    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Huaqiu-Electronics/kicad-win-builder
          releases-only: true
        id: latest-release

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ---------------- BUILD ----------------
      - name: Configure
        run: ./build.ps1 -Config -UseMsvcCmake $False

      - name: Init tools
        run: ./build.ps1 -Init

      - name: Setup env
        run: ./build.ps1 -Env -Arch x64

      - name: Inspect restored vcpkg binary cache
        shell: pwsh
        run: |
          $cachePath = 'C:\Users\runneradmin\AppData\Local\vcpkg\archives'
          if (-not (Test-Path -LiteralPath $cachePath)) {
            Write-Host "vcpkg binary cache directory does not exist: $cachePath"
            exit 0
          }

          $archives = @(Get-ChildItem -LiteralPath $cachePath -Recurse -File -ErrorAction SilentlyContinue)
          $totalBytes = ($archives | Measure-Object -Property Length -Sum).Sum
          if ($null -eq $totalBytes) { $totalBytes = 0 }
          Write-Host ("Restored vcpkg cache: {0} archive files, {1:N2} GiB" -f $archives.Count, ($totalBytes / 1GB))

      - name: Build vcpkg deps
        run: ./build.ps1 -Vcpkg -Latest -Arch x64

      # Save only from the full-installer job, immediately after vcpkg succeeds.
      # This avoids cache-save races and partial caches from cancelled builds.
      - name: Save vcpkg cache
        if: success()
        uses: actions/cache/save@v4
        with:
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives

      - name: Build
        run: ./build.ps1 -Build -Latest -Arch x64 -BuildType Release

      # The edge-headless release tree contains node_modules paths >260 chars
      # under the CI stage root; enable the OS long-path policy before staging
      # (PreparePackage strips the per-user .dsh cache) and NSIS compilation.
      - name: Enable Windows long paths
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Prepare package
        run: ./build.ps1 -PreparePackage -Arch x64 -BuildType Release

      # KiCad upstream does not publish the latest Python SDK to PyPI, so the
      # kicad-python package is intentionally NOT listed in
      # support/extrarequirements.txt. Instead, install the kicad-python wheel
      # generated from the latest KiCad source (Huaqiu build) into the bundled
      # Python staged by PreparePackage at .out/x64-windows-Release/bin/.
      - name: Install kicad-python SDK wheel
        shell: pwsh
        run: |
          $wheelUrl    = 'https://github.com/Huaqiu-Electronics/kicad-python/releases/download/10.0.7/kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl'
          $expectedHash = 'db09d735e65735aac92805d2f5cc7662acc50a6f14322e4dbdd448e82087dcd3'
          $wheelPath    = Join-Path $env:RUNNER_TEMP 'kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl'
          $pythonBin    = '.\.out\x64-windows-Release\bin\python.exe'

          if (-not (Test-Path -LiteralPath $pythonBin)) {
            Write-Error "Bundled Python not found: $pythonBin"
            exit 1
          }

          Invoke-WebRequest -Uri $wheelUrl -OutFile $wheelPath
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheelPath).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            Write-Error "kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }

          & $pythonBin -m pip install $wheelPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (NSIS)
        run: ./build.ps1 -Package -PackType Nsis -Arch x64 -BuildType Release -DebugSymbols

      # ---------------- UPLOAD ----------------
      - name: Upload installer
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.HUAQIU_ELECTRONICS_TOKEN }}
          file: ./.out/kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64.exe
          asset_name: kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64.exe
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}

      - name: Upload pdbs
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.HUAQIU_ELECTRONICS_TOKEN }}
          file: ./.out/kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64-pdbs.zip
          asset_name: kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64-pdbs.zip
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}

      - name: Upload vcpkg pdbs
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.HUAQIU_ELECTRONICS_TOKEN }}
          file: ./.out/kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64-vcpkg-pdbs.zip
          asset_name: kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64-vcpkg-pdbs.zip
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}

  # ------------------------------------------------------------
  # PORTABLE PACKAGE
  # ------------------------------------------------------------
  create_portable_package:
    runs-on: windows-2022

    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Huaqiu-Electronics/kicad-win-builder
          releases-only: true
        id: latest-release

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # ---------------- BUILD ----------------
      - name: Configure
        run: ./build.ps1 -Config -UseMsvcCmake $False

      - name: Init tools
        run: ./build.ps1 -Init

      - name: Setup env
        run: ./build.ps1 -Env -Arch x64

      - name: Build vcpkg deps
        run: ./build.ps1 -Vcpkg -Latest -Arch x64

      - name: Build (portable)
        run: ./build.ps1 -Build -Latest -Arch x64 -BuildType Release -Portable

      - name: Prepare package
        run: ./build.ps1 -PreparePackage -Arch x64 -BuildType Release -Portable

      # Install the kicad-python SDK wheel (generated from the latest KiCad
      # source, not published on PyPI) into the bundled Python staged by
      # PreparePackage at .out/x64-windows-Release/bin/.
      - name: Install kicad-python SDK wheel
        shell: pwsh
        run: |
          $wheelUrl    = 'https://github.com/Huaqiu-Electronics/kicad-python/releases/download/10.0.7/kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl'
          $expectedHash = 'db09d735e65735aac92805d2f5cc7662acc50a6f14322e4dbdd448e82087dcd3'
          $wheelPath    = Join-Path $env:RUNNER_TEMP 'kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl'
          $pythonBin    = '.\.out\x64-windows-Release\bin\python.exe'

          if (-not (Test-Path -LiteralPath $pythonBin)) {
            Write-Error "Bundled Python not found: $pythonBin"
            exit 1
          }

          Invoke-WebRequest -Uri $wheelUrl -OutFile $wheelPath
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheelPath).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            Write-Error "kicad_python-0.9.0.dev0-cp311-cp311-win_amd64.whl checksum mismatch. Expected $expectedHash, got $actualHash"
            exit 1
          }

          & $pythonBin -m pip install $wheelPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (ZIP)
        run: ./build.ps1 -Package -Arch x64 -BuildType Release -Portable

      # ---------------- UPLOAD ----------------
      - name: Upload portable zip
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.HUAQIU_ELECTRONICS_TOKEN }}
          file: ./.out/kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64.zip
          asset_name: kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-x86_64.zip
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}